# ===================================================================
# ENTRE PAÑUELOS - Configuración principal
# ===================================================================
spring.application.name=entre-panuelos-backend
spring.config.import=optional:file:.env[.properties],optional:file:ClubLibertadBackend/.env[.properties]
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/

# Perfil activo por defecto
spring.profiles.active=${SPRING_PROFILE:dev}

# ===================================================================
# Base de datos PostgreSQL
# ===================================================================
# La base de datos corre en Docker (docker-compose.yml) en el puerto 5433
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/entre_panuelos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate
# ===================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# ===================================================================
# Flyway (migraciones de BD)
# ===================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ===================================================================
# JWT
# ===================================================================
app.jwt.secret=${JWT_SECRET:CHANGE_ME_EN_PRODUCCION_MIN_32_CARACTERES_LARGO_POR_FAVOR}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ===================================================================
# CORS
# ===================================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ===================================================================
# Uploads
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.uploads.dir=${UPLOADS_DIR:./uploads}

# ===================================================================
# Logging
# ===================================================================
logging.level.root=INFO
logging.level.com.entrepanuelo=DEBUG
logging.level.com.entrepanuelo.dance.config.RequestLoggingFilter=INFO

# Recuperación de contraseña. Activa SMTP solo cuando estas variables estén configuradas.
app.password-reset.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
app.password-reset.mail-enabled=${PASSWORD_RESET_MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}