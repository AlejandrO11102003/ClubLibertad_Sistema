services:
  db:
    image: postgres:17-alpine
    container_name: entre_panuelos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: entre_panuelos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Lima
    ports:
      # 5433 en el host para no chocar con el PostgreSQL local (5432)
      - "5433:5432"
    volumes:
      - entre_panuelos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d entre_panuelos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./ClubLibertadBackend
    container_name: entre_panuelos_backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/entre_panuelos
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8080
      CORS_ORIGINS: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-A_LOPEZLEGUSTA_EL_PIPILIN_Y_A_ZEÑA_LE_GUSTA_CAMPOS_TELLO_ARQUEROFELIZ}
      UPLOADS_DIR: /app/uploads
      TZ: America/Lima
    ports:
      - "8080:8080"
    volumes:
      - ./ClubLibertadBackend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./ClubLibertadFrontend
      args:
        REACT_APP_API_URL: http://localhost:8080/api
    container_name: entre_panuelos_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  entre_panuelos_pgdata:
    name: entre_panuelos_pgdata
